name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: lint, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-vite-bootstrap-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-vite-bootstrap-project/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
